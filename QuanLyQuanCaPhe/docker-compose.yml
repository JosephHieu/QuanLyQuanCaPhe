version: '3.8'

services:
  app:
    image: nguyenhoanghieu1510/cafe-app:latest
    container_name: cafe-spring-app
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:mysql://db:3306/CafeManagement
      - spring.datasource.username=root
      - spring.datasource.password=hieudeptrai
      - spring.jpa.hibernate.ddl-auto=update
    depends_on:
      - db
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: cafe-mysql-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=hieudeptrai
      - MYSQL_DATABASE=CafeManagement
    volumes:
      - db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Chạy script khi khởi tạo
volumes:
  db-data: