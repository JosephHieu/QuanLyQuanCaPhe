<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Nhân viên</title>
    <th:block th:insert="~{fragments/header :: header-tags}"></th:block>
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/employee.css}" />


</head>
<body>

<div th:insert="~{fragments/header :: header-bar}"></div>

<div class="page-container">

    <div class="sidebar-wrapper">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div th:insert="~{fragments/footer :: footer}"></div>

    </div>

    <main class="main-content">
        <div class="breadcrumb">Danh sách nhân viên</div>

        <table>
            <thead>
            <tr>
                <th>Họ tên</th>
                <th>Chức vụ</th>
                <th class="col-luong">Lương</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="nhanVien : ${danhSachNhanVien}">

                <td th:text="${nhanVien.hoTen}">Đặng Văn Dũng</td>

                <td th:text="${nhanVien.chucVu?.tenChucVu}">Quản lý</td>

                <td class="col-luong"
                    th:text="${#numbers.formatDecimal(nhanVien.chucVu?.luong, 0, 'COMMA', 0, 'POINT')}">
                    10.000.000
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(danhSachNhanVien)}">
                <td colspan="3" style="text-align: center;">Không có nhân viên nào.</td>
            </tr>
            </tbody>
        </table>

    </main>
</div>
<div th:insert="~{fragments/footer :: common_modals}"></div>

</body>
</html>
