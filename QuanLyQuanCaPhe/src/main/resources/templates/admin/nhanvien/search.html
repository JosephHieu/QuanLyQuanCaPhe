<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm Nhân viên</title>
    <th:block th:insert="~{fragments/header :: header-tags}"></th:block>
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/employee.css}" />


</head>
<body>
<div th:insert="~{fragments/header :: header-bar}"></div>

<div class="page-container">
    <div class="sidebar-wrapper">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div th:insert="~{fragments/footer :: footer}"></div>

    </div>

    <main class="main-content">
        <div class="breadcrumb">Tìm kiếm nhân viên</div>

        <form th:action="@{/admin/nhanvien/timkiem}" method="get" class="search-form">
            <label for="keyword" style="font-weight: bold;">🔍</label>
            <input type="text" id="keyword" name="keyword"
                   th:value="${keyword}" placeholder="Nhập tên nhân viên cần tìm..." />
            <button type="submit">➔ Tìm kiếm</button>
        </form>

        <div class="search-results">
            <label style="font-weight: bold;">Kết quả:</label>
            <table>
                <thead>
                <tr>
                    <th>Họ tên</th>
                    <th>Chức vụ</th>
                    <th class="col-luong">Lương</th>
                    <th>Hành động</th> </tr>
                </thead>
                <tbody>
                <tr th:each="nhanVien : ${ketQuaTimKiem}">
                    <td th:text="${nhanVien.hoTen}"></td>
                    <td th:text="${nhanVien.chucVu?.tenChucVu}"></td>
                    <td class="col-luong"
                        th:text="${#numbers.formatDecimal(nhanVien.chucVu?.luong, 0, 'COMMA', 0, 'POINT')}">
                    </td>
                    <td class="actions">
                        <a th:href="@{/admin/nhanvien/edit/{id}(id=${nhanVien.maNhanVien})}"
                           class="btn-edit">Sửa</a>
                        <a th:href="@{/admin/nhanvien/delete/{id}(id=${nhanVien.maNhanVien})}"
                           class="btn-delete"
                           onclick="return confirm('Bạn có chắc muốn xóa nhân viên này?');">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ketQuaTimKiem)}">
                    <td colspan="4" style="text-align: center; font-style: italic;">
                        Không tìm thấy nhân viên nào khớp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:insert="~{fragments/footer :: common_modals}"></div>

</body>
</html>
